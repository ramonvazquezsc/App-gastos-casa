name: Mantener Supabase activo

# Cada día hace unas pocas consultas a la base de datos de Supabase para que el proyecto gratuito
# no se pause por inactividad. Si alguna falla (por ejemplo, proyecto pausado), GitHub te avisa por email.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la API de Supabase
        run: |
          for i in 1 2 3; do
            curl -fsS "https://smupetzjjgohsndtvdre.supabase.co" \
              -H "apikey: sb_publishable_YyoSh1ONzRXFsN5bxUA4dg_9gbsVbd5" > /dev/null
            sleep 5
          done
